<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>Refit - 로그인</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='auth.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="/" class="logo-link">
                    <h2 class="logo">REFIT</h2>
                </a>
                <h1>로그인</h1>
                <p>AI 기반 고객 응답 자동화 서비스에 오신 것을 환영합니다</p>
            </div>
            
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="username">아이디</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <div class="password-input-container">
                        <input type="password" id="password" name="password" required>
                        <i class="fas fa-eye-slash toggle-password"></i>
                    </div>
                </div>
                
                <div class="form-options">
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" name="remember_me" id="remember_me">
                            <span>아이디 저장</span>
                        </label>
                    </div>
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" name="auto_login" id="auto_login">
                            <span>자동 로그인</span>
                        </label>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary auth-button">로그인</button>
                
                <div class="form-links">
                    <a href="/register" class="register-link">계정이 없으신가요? <span>회원가입</span></a>
                </div>
            </form>
            
            <div class="auth-message" id="auth-message"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const togglePassword = document.querySelector('.toggle-password');
            const passwordInput = document.querySelector('#password');
            
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });
            
            const savedUsername = getCookie('saved_username');
            if (savedUsername) {
                document.getElementById('username').value = savedUsername;
                document.getElementById('remember_me').checked = true;
            }
            
            document.getElementById('login-form').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const rememberMe = document.getElementById('remember_me').checked;
                const autoLogin = document.getElementById('auto_login').checked;
                
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);
                formData.append('remember_me', rememberMe);
                formData.append('auto_login', autoLogin);
                
                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const result = await response.json();
                    
                    if (response.ok) {
                        if (result.access_token) {
                            localStorage.setItem('access_token', result.access_token);
                            
                            const date = new Date();
                            date.setTime(date.getTime() + (30 * 24 * 60 * 60 * 1000));
                            document.cookie = `access_token=${result.access_token}; expires=${date.toUTCString()}; path=/`;
                            
                            console.log('인증 토큰이 성공적으로 저장되었습니다.');
                        } else {
                            console.warn('서버 응답에 토큰이 없습니다.');
                        }
                        
                        if (rememberMe) {
                            const date = new Date();
                            date.setTime(date.getTime() + (30 * 24 * 60 * 60 * 1000));
                            document.cookie = `saved_username=${username}; expires=${date.toUTCString()}; path=/`;
                        } else {
                            document.cookie = 'saved_username=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                        }
                        
                        const urlParams = new URLSearchParams(window.location.search);
                        const redirectUrl = urlParams.get('redirect');
                        
                        window.location.href = redirectUrl || '/dashboard';
                    } else {
                        showMessage('오류: ' + result.detail, 'error');
                    }
                } catch (error) {
                    showMessage('오류가 발생했습니다. 다시 시도해주세요.', 'error');
                }
            });
            
            function showMessage(message, type = 'success') {
                const messageElement = document.getElementById('auth-message');
                messageElement.textContent = message;
                messageElement.className = 'auth-message ' + type;
                messageElement.style.display = 'block';
                
                setTimeout(() => {
                    messageElement.style.display = 'none';
                }, 5000);
            }
            
            function getCookie(name) {
                const value = `; ${document.cookie}`;
                const parts = value.split(`; ${name}=`);
                if (parts.length === 2) return parts.pop().split(';').shift();
            }
        });
    </script>
</body>
</html>
